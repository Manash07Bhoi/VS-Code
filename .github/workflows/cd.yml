name: CD — Deploy Frontend to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys the frontend to Netlify when the repository secrets are configured.
# Without them this workflow is a no-op and reports BLOCKED rather than
# fabricating success.
#
# The `secrets` context is NOT available in `if` conditions (neither job-level
# nor step-level — allowed step contexts are env/github/inputs/job/matrix/
# needs/runner/steps/strategy/vars). The gate therefore materializes the
# secrets into job-level `env` (where the secrets context IS available) and
# the steps branch on the resulting env variables. Secret values never appear
# in `if` expressions, command lines, or logs.
jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy frontend to Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        run: |
          npm install -g netlify-cli@latest
          netlify deploy --dir=frontend --prod --message "Deploy $(git rev-parse --short HEAD)"
          echo "Deployed commit $(git rev-parse HEAD) to Netlify site $NETLIFY_SITE_ID"

      - name: Record deployment blocker
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == '' }}
        run: |
          echo "BLOCKED: Netlify frontend deployment cannot run."
          echo "Set NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets to enable CD."
          echo "No deployment was performed and no tokens were exposed."
