[build]
  publish = "."
  command = "echo 'No build step required — static frontend.'"

[build.environment]
  NODE_VERSION = "20"

# Same-origin API proxy to the deployed Render backend. Declared BEFORE the
# SPA fallback because Netlify evaluates redirects in order. Keeping the API
# on the site's own origin keeps the cs.sid cookie first-party (SameSite=Lax).
[[redirects]]
  from = "/api/*"
  to = "https://codesense-ai-backend-9skh.onrender.com/api/:splat"
  status = 200
  force = true

# Unknown paths must not return the app shell: the router is hash-based, so a
# catch-all only serves the sign-in page at arbitrary URLs (a phishing-kit
# signature). Serve a real 404 instead.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Baseline security headers for the HTML entry points (the asset rules below
# only cover /js, /css and /assets).
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
