<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — CodeSense AI</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#05091F" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #05091F; color: #E6EAF5;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    main { max-width: 34rem; text-align: center; }
    .code { font-size: 3rem; letter-spacing: .12em; color: #7C8CFF; font-weight: 700; }
    h1 { font-size: 1.35rem; margin: 12px 0 8px; }
    p { color: #A8B0C4; margin: 0 0 20px; }
    a {
      display: inline-block; padding: 10px 20px; border-radius: 8px;
      background: #4C5FE0; color: #fff; text-decoration: none; font-weight: 600;
    }
    a:focus-visible { outline: 3px solid #9AA6FF; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>This page does not exist</h1>
    <p>CodeSense AI is a single-page application, so its pages use a <code>#/</code> route
       (for example <code>#/dashboard</code>). The address you requested is not part of it.</p>
    <a href="/">Go to CodeSense AI</a>
  </main>
</body>
</html>
